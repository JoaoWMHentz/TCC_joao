# RTAB-Map — modo LOCALIZAÇÃO (mapa do .db somente leitura)
rtabmap:
  ros__parameters:
    Mem/IncrementalMemory: "false"
    Rtabmap/DetectionRate: "4.0"  # tentativas de relocalização por segundo
    # 0: tenta corrigir a pose mesmo com o robô parado — evita ficar preso
    # mal localizado sem conseguir sair do lugar.
    RGBD/LinearUpdate: "0"
    RGBD/AngularUpdate: "0"
    RGBD/LocalImmunizationRatio: "0.25"
    RGBD/MaxOdomCacheSize: "30"
    Icp/CorrespondenceRatio: "0.15"
    # Reg/Strategy é definido pelo launch: 0 (visual) com câmera, 1 (ICP) sem.
